esphome:
  name: esp-daikin-ctrl
  friendly_name: "ESP32 WiFi Daikin Controller"
  name_add_mac_suffix: True

  platformio_options:
    board_build.flash_mode: dio

esp32:
  board: esp32-c3-devkitm-1
  framework:
    type: esp-idf
  variant: ESP32C3

# Enable logging
logger:
  level: VERY_VERBOSE
  hardware_uart: UART0
  baud_rate: 2500000

#Enable Home Assistant API
api:

ota:
  platform: esphome

wifi:
  ap:
  # ssid: !secret wifi_ssid
  # password: !secret wifi_password
  # fast_connect: true

captive_portal: 

external_components:
  - source: components

status_led:
    pin: GPIO4

climate:
  - platform: daikin_ducted
    id: daikin0
    name: "Ducted AC"

    # P1P2/Homebus interface
    rx_pin: 2        # RX from MAX22088
    tx_pin: 3        # TX to MAX22088
    enable_pin: 10   # TX enable

    homekit_climate:
      name: "Ducted AC HomeKit"

    homekit_fan:
      name: "Ducted AC Fan"

    outdoor_intake_temperature:
      name: "Outdoor Intake Temperature"
      filters:
        - throttle_average: 60s
    coolant_temperature:
      name: "Coolant Temperature"
      filters:
        - throttle_average: 60s
    indoor_temperature:
      name: "Indoor Temperature"
      filters:
        - throttle_average: 60s
      
    filter_clean:
      name: "Filter Status"

text_sensor:
  - platform: git_ref
    name: "Git Ref"
    long: true
    all: true
    always: true
    abbrev: 8
    dirty: "-dirty"